name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.9.26"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint Python
        run: uv run --no-sync ruff check backend tests scripts
      - name: Run isolated backend tests
        run: uv run --no-sync pytest -q -m "not postgres" --junitxml=output/ci/backend.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-results
          path: output/ci/backend.xml
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test frontend streams and recovery
        run: npm test -- --reporter=default --reporter=junit --outputFile=../output/ci/frontend.xml
      - name: Type-check and build frontend
        run: npm run build
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-results
          path: output/ci/frontend.xml
          retention-days: 7
      - name: Upload frontend build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rag_ci
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: rag_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_ci -d rag_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      RAG_RUN_POSTGRES_TESTS: "1"
      TEST_POSTGRES_URL: postgresql+asyncpg://rag_ci:ci-only-disposable-password@127.0.0.1:5432/rag_ci
      DATABASE_URL: postgresql+asyncpg://rag_ci:ci-only-disposable-password@127.0.0.1:5432/rag_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.9.26"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Verify migrations against disposable PostgreSQL
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic check
          uv run --no-sync alembic downgrade base
          uv run --no-sync alembic upgrade head
      - name: Verify worker locks, concurrency and lease recovery
        run: uv run --no-sync pytest -q tests/integration/test_postgres_worker.py --junitxml=output/ci/postgres.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-results
          path: output/ci/postgres.xml
          retention-days: 7

  container:
    name: Container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: zhiheng-rag:ci
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application
      - name: Start without network access or external credentials
        run: docker run --detach --network none --name rag-ci zhiheng-rag:ci
      - name: Check API, bundled UI and non-root runtime
        run: docker exec -i rag-ci /app/.venv/bin/python - < scripts/smoke_container.py
      - name: Check Worker CLI
        run: docker exec rag-ci /app/.venv/bin/rag worker --help
      - name: Show container logs on failure
        if: failure()
        run: docker logs rag-ci
      - name: Clean up container
        if: always()
        run: docker rm --force rag-ci

  required:
    name: CI required
    if: always()
    needs: [backend, frontend, postgres, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, result in results.items() if result["result"] != "success"]
          if failed:
              raise SystemExit("Required jobs did not succeed: " + ", ".join(failed))
          print("All required checks passed.")
          PY
