[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Document-grounded enterprise knowledge workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "argon2-cffi>=23.1,<26",
  "boto3>=1.35,<2", "pymilvus>=2.6,<2.7", "python-docx>=1.1,<2",
  "pdfplumber>=0.11,<1", "prometheus-client>=0.21,<1", "typer>=0.15,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.20,<1", "ruff>=0.9,<1"]

[project.scripts]
rag = "rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: opt-in integration tests against an external PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
