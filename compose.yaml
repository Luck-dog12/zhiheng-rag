# Only application processes; every database and model remains external.
services:
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: ["/app/.venv/bin/rag", "worker", "--metrics-host", "0.0.0.0"]
    expose:
      - "9001"
    restart: unless-stopped
